<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Electra</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-logo">
        <a class="brand" href="index.html" aria-label="Electra home">
          <svg class="brand-logo" width="44" height="44" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="electraGradAuth" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#55d6c2" />
                <stop offset="100%" stop-color="#7aa7ff" />
              </linearGradient>
              <linearGradient id="bgGradAuth" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#10232e" />
                <stop offset="100%" stop-color="#071017" />
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="36" height="36" rx="9" fill="url(#bgGradAuth)" stroke="url(#electraGradAuth)" stroke-width="1.5" />
            <path d="M 8 20 H 11 M 29 20 H 32 M 20 8 V 11 M 20 29 V 32" stroke="url(#electraGradAuth)" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
            <path d="M22 9L13 21H19L17 31L27 19H21L22 9Z" fill="url(#electraGradAuth)" />
          </svg>
          <span class="brand-text">ELECTRA<span>.</span></span>
        </a>
      </div>
      
      <div class="eyebrow">CREATE PROFILE</div>
      <h1>Sign Up</h1>
      <p>Create your Electra account.</p>
      
      <form>
        <label>
          Full Name
          <input type="text" placeholder="John Doe" required>
        </label>
        
        <label>
          Email
          <input type="email" placeholder="name@example.com" required>
        </label>
        
        <label>
          Password
          <div class="password-field-wrap">
            <input type="password" placeholder="Min. 8 characters" minlength="8" required>
            <button type="button" class="toggle-password-btn" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </label>
        
        <label>
          Confirm Password
          <div class="password-field-wrap">
            <input type="password" placeholder="Re-enter password" minlength="8" required>
            <button type="button" class="toggle-password-btn" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </label>
        
        <button class="btn primary full" type="submit">Create Account</button>

        <div class="auth-divider">
          <span>OR CONTINUE WITH</span>
        </div>

        <div class="social-auth-buttons">
          <button type="button" class="social-btn google-btn">
            <svg width="18" height="18" viewBox="0 0 24 24">
              <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
              <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
              <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C1.2 8.7.8 10.3.8 12s.4 3.3 1.1 4.7l3.7-2.9z"/>
              <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
            </svg>
            <span>Google</span>
          </button>
          
          <button type="button" class="social-btn apple-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.12-1.95.99-3.09-1 .04-2.2.67-2.92 1.5-.64.73-1.2 1.9-1.05 3.02 1.12.09 2.31-.61 2.98-1.43z"/>
            </svg>
            <span>Apple</span>
          </button>
        </div>
      </form>
      
      <p class="switch">Already registered? <a href="login.html">Login</a></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
